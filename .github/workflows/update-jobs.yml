name: Update job tracker

# Runs the tracker inside GitHub and commits the results back.
# No Muse / connector approval is involved after setup.
# GitHub cron has no timezone support, so we run at every UTC hour that can
# be midnight or noon in Toronto, then gate on America/Toronto inside the job:
#   EDT (Mar-Nov): midnight = 04:00 UTC, noon = 16:00 UTC
#   EST (Nov-Mar): midnight = 05:00 UTC, noon = 17:00 UTC
on:
  schedule:
    - cron: "0 4,5,16,17 * * *"
  workflow_dispatch: {inputs: {force: {description: 'Run the tracker regardless of the Toronto time gate', required: false, default: 'false'}}}

permissions:
  contents: write

concurrency:
  group: job-tracker-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Gate on Toronto midnight/noon
        id: gate
        run: |
          HOUR=$(TZ=America/Toronto date +%H)
          if [ "${{ inputs.force }}" = "true" ] || [ "$HOUR" = "00" ] || [ "$HOUR" = "12" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.run == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tracker (scrape + store + render + build page)
        if: steps.gate.outputs.run == 'yes'
        env:
          JT_NO_PUBLISH: "1"
          JT_BUILD_PAGE: "1"
        run: python3 app.py

      - name: Commit results if changed
        if: steps.gate.outputs.run == 'yes'
        run: |
          rm -f seed.json
          git config user.name "job-tracker bot"
          git config user.email "actions@github.com"
          git add index.html jobs.db dashboard.html
          git add -A seed.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update job dashboard (automated)"
            git push
          fi
