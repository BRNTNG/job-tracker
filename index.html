let f="all", kw="";
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function draw(){
 const items = DATA.listings.filter(c => (f==="all"||c.source===f) &&
   (!kw || (c.title+" "+c.company+" "+c.location).toLowerCase().includes(kw)));
 document.getElementById("count").textContent = items.length + " postings shown";
 document.getElementById("list").innerHTML = items.map(c =>
  `<div class="card"><h3><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>
   ${c.is_new?'<span class="tag new">NEW</span>':""}</h3>
   <div class="meta"><span class="tag ${esc(c.source)}">${esc(c.label)}</span><strong>${esc(c.company||"")}</strong></div>
   <div class="meta">${esc(c.location||"")}${c.salary?" &middot; "+esc(c.salary):""} &middot; posted ${esc(c.posted)}</div></div>`).join("")
 || '<p class="meta">No postings match.</p>';
 document.getElementById("manual").innerHTML = DATA.manual.map(m =>
  `<div><a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.name)}</a><p>${esc(m.note)}</p></div>`).join("");
 const d = new Date(DATA.updated);
 document.getElementById("upd").textContent = "Last checked " + d.toLocaleString();
}
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));b.classList.add("active");f=b.dataset.f;draw()});
document.getElementById("q").oninput=e=>{kw=e.target.value.toLowerCase();draw()};
draw();
